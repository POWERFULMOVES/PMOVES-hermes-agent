# Example PMOVES bootstrap CGP - pmoves.bootstrap/v1
# Same shape as the PMOVES.AI example. Vendored here for hermes-side
# validation (the schema is the source of truth, this is the canary
# fixture). If you change the schema, change the example to match
# and re-run the schema-sync test.
#
# Schema: pmoves_bootstrap/cgp_schema/v1.schema.json
# Canonical spec (PMOVES.AI side): pmoves/docs/PMOVESCHIT/CGP_v1.0_SPECIFICATION.md

spec: pmoves.bootstrap/v1

# === Metadata ===
meta:
  created_at: "2026-08-08T00:30:00+00:00"
  operator: darkxside
  source: mavis
  encoder_version: 0.1.0
  # bootstrap_id omitted - consumers derive from SHA-256(canonical_json)

# === Identity (drives Mavis voice/skin/role) ===
identity:
  agent: minimax
  role: implementer
  skin: dimensional

# === Tools (PMOVES surface available in this session) ===
# The tools_bridge resolves these against Hermes's native toolset.
# Missing tools are silently skipped - the consumer is non-breaking
# (no-override-existing-config + tagged-services-are-advisory).
tools:
  - mavis__agent__create
  - mavis__cron__self
  - mavis__cron__list
  - mavis__cron__create
  - comfyui_client
  - pinokio_launch
  - render_skin
  - gh
  - web_search
  - web_fetch

# === MCPs (servers loaded for this session) ===
mcps:
  - pmoves-nats-mcp
  - pmoves-chit-sign
  - google-workspace
  - obsidian-brain
  - pmoves-neo4j-mcp
  - pmoves-cipher-mcp

# === Services (tagged infrastructure) ===
services:
  tailscale:
    host: powerfullmoves.tail.ts.net
    ip: 100.x.y.z
  rustdesk:
    devices:
      - pixel-10-xl-1
      - pixel-10-xl-2
      - pixel-10
      - tab-ultra-s8
      - tab-ultra-11
  hostinger:
    site: powerfullmoves.com
    status: pending-mgmt
  cloudflare:
    account: powerfullmoves
    zones: []

# === Routing (peer agents in the fleet) ===
routing:
  kiloclaw:
    node: "5090"
    nats_subject: pmoves.agent.task.v1
    target: glm-5.1
  hermes:
    node: TBD
    nats_subject: pmoves.agent.task.v1
    target: hermes-3

# === Constraints (non-breaking guarantees) ===
constraints:
  - no-override-existing-config
  - tagged-services-are-advisory
  - no-chit-bypass
  - no-force-push
  - no-ci-bypass
  - preserve-existing-tools

# === CGP-valid geometry payload (empty) ===
super_nodes: []
